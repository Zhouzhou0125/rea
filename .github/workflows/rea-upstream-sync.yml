name: Sync official REA

on:
  schedule:
    # Daily at 06:23 Asia/Shanghai (22:23 UTC the previous day).
    - cron: '23 22 * * *'
  workflow_dispatch:

# The default GITHUB_TOKEN cannot synchronize changes to workflow files.
# REA_SYNC_TOKEN is a fine-grained PAT limited to this repository, with
# Contents and Workflows read/write. Its value belongs only in Actions secrets.
permissions: {}

concurrency:
  group: rea-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Zhouzhou0125/rea'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the fork and merge official updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REA_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::REA_SYNC_TOKEN is missing. Add a repository-scoped fine-grained PAT with Contents and Workflows read/write to Actions secrets.'
            echo 'Synchronization blocked: REA_SYNC_TOKEN has not been configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          gh api "repos/$GH_REPO" > fork.json
          jq -e '.fork == true and .parent.full_name == "morluto/rea" and .default_branch == "main"' fork.json > /dev/null
          # GitHub reports conflicts as a nonzero exit. Never force-push or reset.
          # No upstream code, package scripts, or analysis targets are executed.
          gh api --method POST "repos/$GH_REPO/merge-upstream" -f branch=main > sync-result.json
          cat sync-result.json
          {
            echo '## Official REA synchronization'
            echo 'Upstream: https://github.com/morluto/rea/tree/main'
            echo 'Destination: https://github.com/Zhouzhou0125/rea/tree/main'
            jq -r '.message, "Merge type: \(.merge_type // "none")"' sync-result.json
            echo 'Conflicts and permission failures stop the job; local commits are not discarded.'
          } >> "$GITHUB_STEP_SUMMARY"

